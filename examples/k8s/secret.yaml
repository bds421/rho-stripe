# Stripe + Postgres credentials.
#
# DO NOT commit the values below to git as-is. Use sealed-secrets,
# ESO, or your secret-management system to inject the real values.
apiVersion: v1
kind: Secret
metadata:
  name: rho-stripe-secrets
  namespace: default
type: Opaque
stringData:
  STRIPE_SECRET_KEY: "sk_test_REPLACE_ME"
  STRIPE_WEBHOOK_SECRET: "whsec_REPLACE_ME"
  STRIPE_WEBHOOK_SECRET_OLD: ""   # Optional: legacy secret during rotation
  POSTGRES_DSN: "postgres://app:REPLACE_ME@postgres-host:5432/myapp?sslmode=require"
