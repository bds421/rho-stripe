# Dependabot config: open PRs for outdated Go modules + Actions
# dependencies. Stripe-go releases follow Stripe API releases, so
# bumping that requires the audit described in
# stripeapi/apiversion_test.go — set the schedule to weekly so a
# human is in the loop.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Group non-stripe-go bumps so we don't drown in trivial PRs.
    groups:
      observability:
        patterns:
          - "go.opentelemetry.io/*"
          - "github.com/prometheus/*"
      stripe-go:
        # Keep stripe-go separate; bumps need the API-version audit.
        patterns:
          - "github.com/stripe/stripe-go/*"

  - package-ecosystem: "gomod"
    directory: "/repos/postgres"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
